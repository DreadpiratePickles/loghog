# Everything this repository can prove without a key.
#
# There are no secrets here and no `secrets.*` reference anywhere in the file.
# Eight of the nine stages are mechanical — ingestion, redaction, scoring,
# clustering, selection, emission, health and drift are all deterministic code —
# and the ninth, `06_label`, only ever runs in CI with `--dry-run`, which calls
# nothing.
#
# That is a deliberate choice rather than a limitation. A scheduled job holding a
# key would spend somebody's quota on every push and would eventually record a
# "live" number nobody chose to buy.
#
# The dataset half of the pipeline — label, emit, promote, health, drift — lives
# in `dataset.yml`, because this file had grown past the four-hundred-line limit
# every committed source file here keeps, and because the two jobs answer
# different questions: this one asks whether a log becomes a window without
# leaking anything, and that one asks whether a window becomes a dataset project
# 1 will load.
#
# The action SHAs are pinned and were copied from project 1's workflow, which is
# where they were first read. A tag is a moving reference, and an action that
# changes under a pinned tag is a supply-chain problem in the one place a
# repository executes somebody else's code.
#
# Four things are checked, in order of how fast they fail:
#
#   lint       ruff, at the line length pyproject.toml sets
#   tests      the whole suite, none of which touches the network
#   privacy    the redactor, from a shell, against the committed sample — and
#              then a grep over the window it wrote for the things that must not
#              be in it and the things that must
#   lifecycle  ingest -> append -> score -> cluster -> select -> drift, on a
#              COPY of the repository
#
# The privacy job is the one worth having. Unit tests prove the detectors; this
# proves that a window written by the real command line, through the real
# configuration, does not contain an email address — which is the only claim
# this repository actually makes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, tests, privacy, offline lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      # A copy, not the checkout. Nothing here should ever write inside the
      # repository, and the last step of this job asserts that it did not.
      - name: The whole lifecycle, offline
        run: |
          set -euo pipefail
          demo="$(mktemp -d)"
          cp loghog.toml "$demo/"
          cp -R mappings samples "$demo/"
          loghog() { uv run loghog "$@" --config "$demo/loghog.toml"; }

          echo "--- the built-in mappings load ---"
          loghog mappings list

          # `ingest` exits 1 on the sample, on purpose: two of its thirteen
          # lines are broken by design. A run that returned 0 over them would be
          # the failure this tool exists to prevent, so the code is captured and
          # asserted rather than allowed to abort the job.
          echo "--- ingest, which must exit 1 ---"
          set +e
          loghog ingest --input samples/support_chat.synthetic.jsonl \
              --format jsonl --mapping openai_chat_jsonl \
              --window demo --synthetic | tee "$demo/ingest.txt"
          code=${PIPESTATUS[0]}
          set -e
          test "${code}" -eq 1 || {
            echo "::error::ingest exited ${code}; the sample has two broken lines and must exit 1."
            exit 1
          }

          echo "--- the second file, appended into the same window ---"
          loghog ingest --input samples/support_tickets.synthetic.csv \
              --format csv --mapping "$demo/samples/support_csv.toml" \
              --window demo --append --synthetic

          echo "--- re-ingesting the same file must be refused ---"
          set +e
          loghog ingest --input samples/support_chat.synthetic.jsonl \
              --format jsonl --mapping openai_chat_jsonl \
              --window demo --append 2> "$demo/refusal.txt"
          refused=$?
          set -e
          test "${refused}" -eq 3 || {
            echo "::error::re-ingesting an already-ingested file exited ${refused}, expected 3."
            exit 1
          }
          grep -q "already been ingested" "$demo/refusal.txt"

          loghog window show --window demo | tee "$demo/show.txt"

          echo "--- the banners ---"
          head -1 "$demo/ingest.txt" | grep -q '^SYNTHETIC'
          head -1 "$demo/show.txt" | grep -q '^SYNTHETIC'
          head -1 "$demo/records/demo/ingest.md" | grep -q '^SYNTHETIC'
          head -1 samples/README.md | grep -q '^SYNTHETIC'

          echo "--- what must NOT be in the window ---"
          records="$demo/records/demo/records.jsonl"
          for leaked in \
              'susan.calvin@example.com' \
              'kim.reyes@example.com' \
              '4242 4242 4242 4242' \
              '4111-1111-1111-1111' \
              '123-45-6789' \
              'GB33BUKB20201555555555' \
              '192.168.1.14' \
              '221B Baker Street'; do
            if grep -qF "${leaked}" "${records}"; then
              echo "::error::the window contains ${leaked}. Redaction did not hold."
              exit 1
            fi
          done

          echo "--- what MUST be in the window ---"
          # The order reference fails Luhn and is the case; the allowlisted
          # product is not a person. Losing either is a redactor that has
          # destroyed the dataset to protect it.
          grep -qF '1234567812345678' "${records}"
          grep -qF '8899001122334455' "${records}"
          grep -qF '9911-2233' "${records}"
          grep -qF 'Dr Pepper' "${records}"
          grep -qF '[EMAIL_1]' "${records}"
          grep -qF 'app.example.com/users/[EMAIL_1]' "${records}"

          echo "--- the error report names every rejected line and quotes none ---"
          test "$(wc -l < "$demo/records/demo/errors.jsonl")" -ge 2
          grep -q 'LineParseError' "$demo/records/demo/errors.jsonl"
          grep -q 'RecordError' "$demo/records/demo/errors.jsonl"

          echo "--- redact, from a shell, on text that never touches a file ---"
          loghog redact --text "Dr Susan Calvin, sam@example.com, 4242 4242 4242 4242, order 1234567812345678" \
              | tee "$demo/redact.txt"
          grep -q '\[EMAIL_1\]' "$demo/redact.txt"
          grep -q '\[CARD_1\]' "$demo/redact.txt"
          grep -qF '1234567812345678' "$demo/redact.txt"

          # --- Phase B, over the judged sample ----------------------------
          #
          # The judged sample is thirteen invented events written so that twelve
          # of the thirteen signals fire on it, and the thirteenth (`novelty`)
          # fires as soon as a goldens file is passed. A scoring stage
          # demonstrated against a log where nothing fires is a scoring stage
          # nobody has seen work.
          #
          # `dedupe = false` for this window on purpose: deduplication is on the
          # input, so with it on the two prompt versions answering one question
          # are already one record and `version_disagreement` cannot be seen.
          # Both halves of that are asserted below.
          echo "--- Phase B: score, cluster, select, drift ---"
          sed 's/^dedupe = true/dedupe = false/' "$demo/loghog.toml" > "$demo/nodedupe.toml"
          nodedupe() { uv run loghog "$@" --config "$demo/nodedupe.toml"; }

          cat > "$demo/goldens.yaml" <<'GOLDENS'
          - id: parcel_left_in_bin
            tags: [delivery]
            input: The delivery driver left the parcel in the recycling bin without ringing.
            criteria:
              - names the parcel and the bin
          GOLDENS

          nodedupe ingest --input samples/judged_summaries.synthetic.jsonl \
              --format jsonl --mapping "$demo/samples/judged_summaries.toml" \
              --window judged --synthetic
          nodedupe score --window judged --existing "$demo/goldens.yaml" | tee "$demo/score.txt"
          nodedupe cluster --window judged | tee "$demo/cluster.txt"
          nodedupe select  --window judged | tee "$demo/select.txt"

          echo "--- every signal fired, and the report says none was skipped ---"
          for signal in error judge_failure negative_feedback feedback_conflict \
                        version_disagreement injection_pattern refusal_pattern \
                        format_violation novelty latency_outlier length_outlier \
                        non_ascii_ratio tiny_input; do
            grep -qE "^  ${signal}  [0-9]+$" "$demo/score.txt" || {
              echo "::error::signal ${signal} did not fire on the judged sample."
              exit 1
            }
          done
          grep -qF 'Every signal had what it needed.' "$demo/records/judged/score.md"

          echo "--- redaction held in this window too ---"
          judged="$demo/records/judged/records.jsonl"
          if grep -qF 'sam.doe@example.com' "${judged}"; then
            echo "::error::the judged window contains an address. Redaction did not hold."
            exit 1
          fi
          grep -qF '[EMAIL_1]' "${judged}"

          echo "--- the paraphrase clustered with its twin ---"
          grep -qF '"js-010"' "$demo/records/judged/clusters.json"
          uv run python -c "
          import json, sys
          clusters = json.load(open('$demo/records/judged/clusters.json'))['clusters']
          pairs = [c['member_ids'] for c in clusters if c['size'] > 1]
          sys.exit(0 if ['js-001', 'js-010'] in pairs else 1)
          " || {
            echo "::error::js-001 and js-010 are paraphrases and did not cluster."
            exit 1
          }

          echo "--- no cap is silent ---"
          grep -q 'dropped, by cap:' "$demo/select.txt"
          grep -q 'unfilled strata, never topped up from another' "$demo/select.txt"
          grep -q '## What was dropped, and by which cap' "$demo/selected/judged/selection.md"

          echo "--- a deduplicated window says the disagreement is invisible, and exits 1 ---"
          set +e
          loghog ingest --input samples/judged_summaries.synthetic.jsonl \
              --format jsonl --mapping "$demo/samples/judged_summaries.toml" \
              --window deduped --synthetic > /dev/null
          loghog score --window deduped > "$demo/deduped.txt"
          blocked=$?
          set -e
          test "${blocked}" -eq 1 || {
            echo "::error::score over a deduplicated window exited ${blocked}, expected 1."
            exit 1
          }
          grep -q 'NOT EVALUATED: version_disagreement' "$demo/deduped.txt"

          echo "--- drift, between two windows built from two different samples ---"
          nodedupe ingest --input samples/support_chat.synthetic.jsonl \
              --format jsonl --mapping openai_chat_jsonl --window chat --synthetic || true
          nodedupe score   --window chat > /dev/null
          nodedupe cluster --window chat > /dev/null
          nodedupe drift --from chat --to judged | tee "$demo/drift.txt"
          grep -q 'new cluster' "$demo/drift.txt"
          test -f "$demo/drift/chat-vs-judged.json"

          # The claim every one of these reports makes about itself. `records.jsonl`
          # and `candidates.jsonl` hold the case, because the next stage needs it;
          # nothing else does, because a report is what somebody pastes into a
          # ticket.
          echo "--- not one report quotes the text it is reporting on ---"
          for report in "$demo/records/judged/score.md" \
                        "$demo/records/judged/cluster.md" \
                        "$demo/selected/judged/selection.md" \
                        "$demo/drift/chat-vs-judged.md"; do
            for leaked in 'recycling bin' 'kettle' 'warranty card' 'sam.doe@example.com' \
                          'Dr Pepper' 'flickers'; do
              if grep -qF "${leaked}" "${report}"; then
                echo "::error::${report} quotes '${leaked}'. A report is not a second copy of the data."
                exit 1
              fi
            done
          done

          echo "--- the shortlist DOES carry the case, because stage 06 needs it ---"
          grep -qF 'recycling bin' "$demo/selected/judged/candidates.jsonl"


          # `git status --porcelain` is the load-bearing check because it sees
          # untracked files too — a stage that wrote a brand-new records/ into
          # the checkout would leave `git diff` completely silent. `records/` is
          # gitignored, so this also proves the ignore rule is anchored the way
          # it claims to be.
          echo "--- the checkout was not touched ---"
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::the lifecycle job wrote inside the checkout."
            exit 1
          }
          test ! -d records || {
            echo "::error::a records/ directory appeared in the checkout."
            exit 1
          }
          echo "the checkout is clean"
